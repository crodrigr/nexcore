name: Build & Publish Docker Images

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 25 + Gradle cache ──────────────────────────────────────────────
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Node 20 + npm cache ─────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nexcore-frontend/package-lock.json

      # ── Build artifacts ─────────────────────────────────────────────────────
      - name: Build nexcore-core (Gradle)
        working-directory: nexcore-core
        run: ./gradlew clean bootJar -x test

      - name: Build nexcore-auth (Gradle)
        working-directory: nexcore-auth-service
        run: ./gradlew clean bootJar -x test

      - name: Build nexcore-frontend (Angular)
        working-directory: nexcore-frontend
        run: npm ci && npm run build

      # ── Docker ──────────────────────────────────────────────────────────────
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push nexcore-core
        uses: docker/build-push-action@v6
        with:
          context: nexcore-core
          file: nexcore-infra/docker/dockerfiles/Dockerfile-core.yml
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/nexcore-core:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push nexcore-auth
        uses: docker/build-push-action@v6
        with:
          context: nexcore-auth-service
          file: nexcore-infra/docker/dockerfiles/Dockerfile-auth.yml
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/nexcore-auth:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push nexcore-frontend
        uses: docker/build-push-action@v6
        with:
          context: nexcore-frontend
          file: nexcore-infra/docker/dockerfiles/Dockerfile-frontend.yml
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/nexcore-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
