services:

  # ─────────────────────────────────────────────
  # nexcore-core  →  puerto 8080
  # ─────────────────────────────────────────────
  nexcore-core:
    build:
      context: ../../nexcore-core
      dockerfile: ../nexcore-infra/docker/dockerfiles/Dockerfile-core.yml
    container_name: nexcore-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/postgres
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: nexcore-redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
    networks:
      - nexcore-network
    depends_on:
      - postgres
      - redis

  # ─────────────────────────────────────────────
  # nexcore-auth-service  →  puerto 8081
  # ─────────────────────────────────────────────
  nexcore-auth:
    build:
      context: ../../nexcore-auth-service
      dockerfile: ../nexcore-infra/docker/dockerfiles/Dockerfile-auth.yml
    container_name: nexcore-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/postgres
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: nexcore-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-changeme-this-is-a-secret-key-for-jwt-signing-must-be-at-least-256-bits}
      NEXCORE_CORE_URL: http://nexcore-core:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
      NEXCORE_AUTH_OTP_FIXED_ENABLED: ${OTP_FIXED_ENABLED:-true}
      NEXCORE_AUTH_OTP_FIXED_CODE: ${OTP_FIXED_CODE:-111111}
    networks:
      - nexcore-network
    depends_on:
      - postgres
      - redis
      - nexcore-core

  # ─────────────────────────────────────────────
  # nexcore-frontend  →  puerto 4200
  # ─────────────────────────────────────────────
  nexcore-frontend:
    build:
      context: ../../nexcore-frontend
      dockerfile: ../nexcore-infra/docker/dockerfiles/Dockerfile-frontend.yml
    container_name: nexcore-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - nexcore-network
    depends_on:
      - nexcore-core
      - nexcore-auth

networks:
  nexcore-network:
    external: true
