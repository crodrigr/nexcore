services:

  # 🗄 POSTGRES
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-nexcore_db}
      POSTGRES_USER:     ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - nexcore_postgres_data:/var/lib/postgresql/data
    networks:
      - nexcore-network 


  # 📧 Postfix relay for sending real emails from containers
  postfix:
    image: boky/postfix:latest
    container_name: postfix-relay
    restart: unless-stopped
    ports:
      - "1587:587" # submission port
    environment:
      - HOSTNAME=postfix
      - ALLOWED_SENDER_DOMAINS=example.com
      # If you need a relay host, uncomment and set the following:
      # - RELAYHOST=smtp.relay.example.com:587
      # - RELAYHOST_USERNAME=relayuser
      # - RELAYHOST_PASSWORD=relaypass
    networks:
      - nexcore-network

  # 🔴 REDIS — caché de políticas de API (role_api_policies)
  redis:
    image: redis:7-alpine
    container_name: nexcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nexcore_redis_data:/data
    networks:
      - nexcore-network

volumes:
  nexcore_postgres_data:
    name: docker_nexcore_postgres_data
  nexcore_redis_data:
    name: docker_nexcore_redis_data

networks:
  nexcore-network:
    driver: bridge
    name: nexcore-network
