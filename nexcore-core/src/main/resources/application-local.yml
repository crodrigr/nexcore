server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local

  application:
    name: nexcore-core

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: crodrigr.test1@gmail.com
    password: "xqwd vqvg pauk mptb"
    properties:
      mail:
