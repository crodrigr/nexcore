<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Header del sidebar -->
  <div class="sidebar-header">

    <!-- Colapsado: N centrada actúa como botón de expandir -->
    <button *ngIf="isCollapsed"
            type="button"
            class="brand-expand-btn"
            (click)="layout.toggle()"
            aria-label="Expand sidebar"
            title="Expand sidebar">
      <div class="brand-mark">N</div>
    </button>

    <!-- Expandido: brand a la izquierda + hamburger a la derecha -->
    <ng-container *ngIf="!isCollapsed">
      <a routerLink="/dashboard" class="sidebar-brand">
        <div class="brand-mark">N</div>
        <span class="brand-label">NexCore</span>
      </a>
      <button type="button"
              class="sidebar-hamburger"
              (click)="layout.toggle()"
              aria-label="Collapse sidebar">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" width="17" height="17">
          <rect x="1" y="4"   width="18" height="2" rx="1" fill="currentColor"/>
          <rect x="1" y="9"   width="12" height="2" rx="1" fill="currentColor"/>
          <rect x="1" y="14"  width="15" height="2" rx="1" fill="currentColor"/>
        </svg>
      </button>
    </ng-container>

  </div>

  <nav class="sidebar-nav">
    <ng-container *ngIf="sidebarMenus$ | async as sidebarMenus">
      <ng-container *ngFor="let menu of sidebarMenus">

        <!-- ITEM -->
        <a *ngIf="menu.item_type === 'ITEM'"
            [routerLink]="getMenuRoute(menu.route)"
           class="sidebar-link"
            [class.active]="isMenuActive(menu.route)"
           [class.disabled]="isMenuDisabled(menu)"
            (click)="setActiveMenu(menu.route)"
             [attr.data-tooltip]="getMenuLabel(menu)">
          <img class="icon" [src]="getIconUrl(menu)" [alt]="getIconName(menu)" aria-hidden="true" (error)="onIconError($event)" />
          <span class="link-label">{{ getMenuLabel(menu) }}</span>
        </a>

        <!-- GROUP -->
        <div *ngIf="menu.item_type === 'GROUP'" class="sidebar-group" [class.expanded]="isGroupExpanded(menu)">
          <button type="button"
                  class="sidebar-group-toggle"
                  [attr.aria-expanded]="isGroupExpanded(menu)"
                  [attr.data-tooltip]="getMenuLabel(menu)"
                  (click)="toggleGroup(menu)">
            <span class="sidebar-group-main">
              <img class="icon" [src]="getIconUrl(menu)" [alt]="getIconName(menu)" aria-hidden="true" (error)="onIconError($event)" />
              <span class="sidebar-group-title">{{ getMenuLabel(menu) }}</span>
            </span>
            <span class="sidebar-group-chevron" [class.open]="isGroupExpanded(menu)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </span>
          </button>

          <!-- Flyout para collapsed (hover) -->
          <div class="sidebar-group-flyout">
            <div class="flyout-header">{{ getMenuLabel(menu) }}</div>
            <a *ngFor="let child of menu.children"
               [routerLink]="getMenuRoute(child.route)"
               class="flyout-link"
               [class.active]="isMenuActive(child.route)"
               [class.disabled]="isMenuDisabled(child)"
               (click)="setActiveMenu(child.route)">
              <img class="icon" [src]="getIconUrl(child)" [alt]="getIconName(child)" aria-hidden="true" (error)="onIconError($event)" />
              <span>{{ getMenuLabel(child) }}</span>
            </a>
          </div>

          <!-- Children para expanded -->
          <div class="sidebar-group-children" [class.hidden]="!isGroupExpanded(menu)">
            <a *ngFor="let child of menu.children"
              [routerLink]="getMenuRoute(child.route)"
               class="child-link"
               [class.active]="isMenuActive(child.route)"
               [class.disabled]="isMenuDisabled(child)"
               (click)="setActiveMenu(child.route)">
              {{ getMenuLabel(child) }}
            </a>
          </div>
        </div>

      </ng-container>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="plan-card">
      <div class="small">© 2026 NexCore Enterprise · v0.0.2</div>
    </div>
  </div>

</aside>
