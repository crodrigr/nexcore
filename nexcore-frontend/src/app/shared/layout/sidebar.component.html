<aside class="sidebar">
  <!-- Profile removed: avatar and texts intentionally omitted per request -->

  <nav class="sidebar-nav">
    <ng-container *ngIf="sidebarMenus$ | async as sidebarMenus">
      <ng-container *ngFor="let menu of sidebarMenus">
        <a *ngIf="menu.item_type === 'ITEM'"
           [routerLink]="menu.route"
           class="sidebar-link"
            [class.active]="isMenuActive(menu.route)"
           [class.disabled]="isMenuDisabled(menu)"
            (click)="setActiveMenu(menu.route)"
           [attr.data-tooltip]="menu.title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" [ngSwitch]="getIconName(menu)">
            <ng-container *ngSwitchCase="'layout-dashboard'">
              <rect x="3" y="3" width="8" height="8" rx="1"/>
              <rect x="13" y="3" width="8" height="8" rx="1"/>
              <rect x="3" y="13" width="8" height="8" rx="1"/>
              <rect x="13" y="13" width="8" height="8" rx="1"/>
            </ng-container>
            <ng-container *ngSwitchCase="'bell'">
              <path d="M15 17H9a3 3 0 006 0z" />
              <path d="M18.5 13.5V11a6.5 6.5 0 10-13 0v2.5L4 16h16l-1.5-2.5z" />
            </ng-container>
            <ng-container *ngSwitchCase="'alert-circle'">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v5" />
              <circle cx="12" cy="16.5" r="0.8" fill="currentColor" stroke="none" />
            </ng-container>
            <ng-container *ngSwitchCase="'radar'">
              <circle cx="12" cy="12" r="2" />
              <path d="M12 2a10 10 0 0 1 10 10" />
              <path d="M12 6a6 6 0 0 1 6 6" />
              <path d="M12 10a2 2 0 0 1 2 2" />
              <path d="M12 12l7 7" />
            </ng-container>
            <ng-container *ngSwitchDefault>
              <rect x="4" y="4" width="16" height="16" rx="3" />
            </ng-container>
          </svg>
          <span>{{ menu.title }}</span>
        </a>

        <div *ngIf="menu.item_type === 'GROUP'" class="sidebar-group">
          <div class="sidebar-group-title">{{ menu.title }}</div>
          <a *ngFor="let child of menu.children"
             [routerLink]="child.route"
             class="sidebar-link"
             [class.active]="isMenuActive(child.route)"
             [class.disabled]="isMenuDisabled(child)"
             (click)="setActiveMenu(child.route)"
             [attr.data-tooltip]="child.title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" [ngSwitch]="getIconName(child)">
              <ng-container *ngSwitchCase="'user'">
                <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" />
                <path d="M5 20a7 7 0 0 1 14 0" />
              </ng-container>
              <ng-container *ngSwitchCase="'settings'">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 0 1 2.3 16.88l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L4.27 3.7A2 2 0 0 1 7.1 1.88l.06.06a1.65 1.65 0 0 0 1.82.33h.09A1.65 1.65 0 0 0 11.3 1.7V1a2 2 0 0 1 4 0v.09c.2.07.39.17.56.29.6.41 1.39.26 1.8-.34l.06-.06A2 2 0 0 1 20.7 3.12l-.06.06a1.65 1.65 0 0 0-.33 1.82c.12.35.3.68.54.97.3.36.75.58 1.23.58H21a2 2 0 0 1 0 4h-.09c-.48 0-.93.22-1.23.58-.24.29-.42.62-.54.97z"/>
              </ng-container>
              <ng-container *ngSwitchCase="'logout'">
                <path d="M16 17l5-5-5-5" />
                <path d="M21 12H9" />
                <path d="M8 5v14" />
              </ng-container>
              <ng-container *ngSwitchCase="'users'">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </ng-container>
              <ng-container *ngSwitchCase="'lock'">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 1 1 8 0v4" />
              </ng-container>
              <ng-container *ngSwitchCase="'layout-navbar'">
                <path d="M4 6h16" />
                <path d="M4 12h16" />
                <path d="M4 18h16" />
              </ng-container>
              <ng-container *ngSwitchCase="'history'">
                <path d="M3 3v5h5" />
                <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
                <path d="M12 7v5l3 3" />
              </ng-container>
              <ng-container *ngSwitchDefault>
                <circle cx="12" cy="12" r="8" />
              </ng-container>
            </svg>
            <span>{{ child.title }}</span>
          </a>
        </div>
      </ng-container>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="plan-card">   
      <div class="small">© 2026 NexCore Enterprise · v0.0.1</div>
    </div>
  </div>
</aside>
