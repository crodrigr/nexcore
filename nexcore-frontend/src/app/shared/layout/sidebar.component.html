<aside class="sidebar">
  <!-- Profile removed: avatar and texts intentionally omitted per request -->

  <nav class="sidebar-nav">
    <ng-container *ngIf="sidebarMenus$ | async as sidebarMenus">
      <ng-container *ngFor="let menu of sidebarMenus">
        <a *ngIf="menu.item_type === 'ITEM'"
           [routerLink]="menu.route"
           class="sidebar-link"
            [class.active]="isMenuActive(menu.route)"
           [class.disabled]="isMenuDisabled(menu)"
            (click)="setActiveMenu(menu.route)"
             [attr.data-tooltip]="getMenuLabel(menu)">
          <img class="icon" [src]="getIconUrl(menu)" [alt]="getIconName(menu)" aria-hidden="true" (error)="onIconError($event)" />
           <span>{{ getMenuLabel(menu) }}</span>
        </a>

        <div *ngIf="menu.item_type === 'GROUP'" class="sidebar-group">
           <div class="sidebar-group-title">{{ getMenuLabel(menu) }}</div>
          <a *ngFor="let child of menu.children"
             [routerLink]="child.route"
             class="sidebar-link"
             [class.active]="isMenuActive(child.route)"
             [class.disabled]="isMenuDisabled(child)"
             (click)="setActiveMenu(child.route)"
             [attr.data-tooltip]="getMenuLabel(child)">
            <img class="icon" [src]="getIconUrl(child)" [alt]="getIconName(child)" aria-hidden="true" (error)="onIconError($event)" />
            <span>{{ getMenuLabel(child) }}</span>
          </a>
        </div>
      </ng-container>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="plan-card">   
      <div class="small">© 2026 NexCore Enterprise · v0.0.1</div>
    </div>
  </div>
</aside>
