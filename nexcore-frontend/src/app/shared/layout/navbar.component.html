<header class="navbar">
  <div class="navbar-left">
    <button class="icon-btn hamburger-btn" aria-label="Toggle sidebar" (click)="toggleSidebar()" [attr.aria-pressed]="isCollapsed" type="button">
      <svg viewBox="0 0 24 24" class="icon"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a routerLink="/dashboard" class="brand" aria-label="NexCore Home">NexCore</a>
    

  </div>

  <div class="navbar-center">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.5" fill="none"></circle><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.5"></line></svg>
      <input placeholder="Search..." />
    </div>
  </div>

  <div class="navbar-right">
    <button #notifBtn class="icon-btn notification-btn" aria-label="Notifications" aria-haspopup="true" data-count="3" (click)="toggleNotifications(); $event.stopPropagation()">
      <!-- Polished bell icon with subtle fill and ring animation support -->
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17H9a3 3 0 006 0z" />
          <path d="M18.5 13.5V11a6.5 6.5 0 10-13 0v2.5L4 16h16l-1.5-2.5z" />
        </g>
      </svg>
      <span class="notif-badge" aria-hidden="true">3</span>
      <span class="notif-pulse" aria-hidden="true"></span>
      <span class="visually-hidden">{{ 'navbar.notifications.you_have' | transloco: { count: 3 } }}</span>
    </button>
    <!-- notification dropdown is created dynamically and appended to document.body -->
    <app-notification *ngIf="showNotifications && fallbackInline" class="notification-dropdown" [anchor]="notificationAnchor" (click)="$event.stopPropagation()"></app-notification>

    <app-theme-toggle></app-theme-toggle>

    <!-- Compact language button (always visible) with localized popup aligned to the button -->
    <div class="lang-compact-wrap">
      <button class="lang-compact" aria-label="Change language" (click)="toggleLangMenu(); $event.stopPropagation()">🌐</button>
      <!-- Small language popup shown when compact button is toggled -->
      <ul class="lang-popup" role="menu" *ngIf="showLangMenu">
        <li class="lang-popup-item" role="menuitem" [class.active]="currentLang === 'en'" (click)="selectLang('en'); $event.stopPropagation()" [attr.aria-current]="currentLang === 'en' ? 'true' : null">
          <span class="flag">🇬🇧</span>
          <span class="label">{{ 'navbar.lang.english' | transloco }}</span>
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
        </li>
        <li class="lang-popup-item" role="menuitem" [class.active]="currentLang === 'es'" (click)="selectLang('es'); $event.stopPropagation()" [attr.aria-current]="currentLang === 'es' ? 'true' : null">
          <span class="flag">🇪🇸</span>
          <span class="label">{{ 'navbar.lang.spanish' | transloco }}</span>
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
        </li>
      </ul>
    </div>

    <!-- plan-info removed per request -->

    <!-- Moved profile into navbar (avatar + name/role) -->
    <div class="nav-profile" title="User Profile" (click)="toggleProfile(); $event.stopPropagation()">
      <div class="avatar">{{ userInitials }}</div>

      <div class="profile-dropdown" *ngIf="showProfile" (click)="$event.stopPropagation()">
        <div class="profile-top" *ngIf="user$ | async as user">
          <div class="avatar-lg">{{ userInitials }}</div>
          <div class="profile-meta">
            <div class="name">{{ user.name }}</div>
            <div class="email">{{ user.email }}</div>
          </div>
        </div>
        <div class="profile-actions">
          <!-- Menús dinámicos del profile -->
          <ng-container *ngIf="profileMenus$ | async as profileMenus">
            <ng-container *ngFor="let menu of profileMenus">
              <!-- Menú tipo ITEM -->
              <button *ngIf="menu.item_type === 'ITEM' && menu.access !== 'hidden'"
                      class="item"
                      type="button"
                      [class.disabled]="isMenuDisabled(menu)"
                      (click)="navigateToMenu(menu); $event.stopPropagation()">
                <img class="menu-icon" [src]="getIconUrl(menu)" [alt]="getIconName(menu)" aria-hidden="true" (error)="onIconError($event)" />
                <span class="item-label">{{ getMenuLabel(menu) }}</span>
              </button>

              <!-- Menú tipo DIVIDER -->
              <div *ngIf="menu.item_type === 'DIVIDER' && menu.access !== 'hidden'" class="divider"></div>

              <!-- Menú tipo GROUP - mostrar título y sus hijos -->
              <ng-container *ngIf="menu.item_type === 'GROUP' && menu.access !== 'hidden'">
                <div class="group-title" *ngIf="menu.title">{{ getMenuLabel(menu) }}</div>
                <ng-container *ngFor="let child of menu.children">
                  <button *ngIf="child.access !== 'hidden'"
                          class="item"
                          type="button"
                          [class.disabled]="isMenuDisabled(child)"
                          (click)="navigateToMenu(child); $event.stopPropagation()">
                    <img class="menu-icon" [src]="getIconUrl(child)" [alt]="getIconName(child)" aria-hidden="true" (error)="onIconError($event)" />
                    <span class="item-label">{{ getMenuLabel(child) }}</span>
                  </button>
                </ng-container>
              </ng-container>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</header>
