<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- Diamond/core shape with subtle inner cut to imply a core -->
  <g transform="translate(32,32)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="url(#g)" transform="rotate(45)" />
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="rgba(255,255,255,0.12)" transform="rotate(45)" />
  </g>
</svg>
