<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Minimal network: central core + three nodes + connecting lines -->
  <circle cx="32" cy="32" r="18" fill="#0F172A" opacity="0.06" />
  <circle cx="32" cy="32" r="10" fill="#0EA5FF" />
  <!-- Nodes -->
  <circle cx="18" cy="20" r="4" fill="#00D1FF" />
  <circle cx="46" cy="18" r="4" fill="#00D1FF" />
  <circle cx="46" cy="46" r="4" fill="#00D1FF" />
  <!-- Connections -->
  <line x1="21" y1="24" x2="30" y2="30" stroke="#00D1FF" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="21" x2="36" y2="30" stroke="#00D1FF" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="44" x2="36" y2="36" stroke="#00D1FF" stroke-width="2" stroke-linecap="round" />
</svg>
