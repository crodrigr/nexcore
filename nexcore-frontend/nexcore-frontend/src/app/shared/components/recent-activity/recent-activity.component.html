<section class="activity">
  <div class="activity-card">
    <div class="activity-header">
      <h3>Actividad Reciente</h3>
      <a class="link">Ver todo</a>
    </div>

    <table class="activity-table">
      <thead>
        <tr><th>Usuario</th><th>Acción</th><th>Tenant</th><th>Fecha</th><th>Estado</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of activities">
          <td>
            <div class="user"><div class="avatar-sm">{{ a.initials }}</div> <span class="user-name">{{ a.name }}</span></div>
          </td>
          <td>{{ a.action }}</td>
          <td>{{ a.tenant }}</td>
          <td>{{ a.time }}</td>
          <td><span [ngClass]="statusClass(a.status)">{{ a.status === 'success' ? 'ÉXITO' : (a.status === 'error' ? 'ERROR' : 'PENDIENTE') }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
