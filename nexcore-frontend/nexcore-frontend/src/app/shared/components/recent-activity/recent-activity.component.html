<section class="activity">
  <div class="activity-card">
    <div class="activity-header">
      <h3>Recent Activity</h3>
      <a class="link">View all</a>
    </div>

    <table class="activity-table">
      <thead>
        <tr><th>User</th><th>Action</th><th>Tenant</th><th>Date</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of activities">
          <td>
            <div class="user"><div class="avatar-sm">{{ a.initials }}</div> <span class="user-name">{{ a.name }}</span></div>
          </td>
          <td>{{ a.action }}</td>
          <td>{{ a.tenant }}</td>
          <td>{{ a.time }}</td>
          <td><span [ngClass]="statusClass(a.status)">{{ a.status === 'success' ? 'SUCCESS' : (a.status === 'error' ? 'ERROR' : 'PENDING') }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
