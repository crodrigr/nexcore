<header class="navbar">
  <div class="navbar-left">
    <button class="icon-btn hamburger-btn" aria-label="Toggle sidebar" (click)="toggleSidebar()" [attr.aria-pressed]="isCollapsed" type="button">
      <svg viewBox="0 0 24 24" class="icon"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a routerLink="/dashboard" class="brand" aria-label="NexCore Home">NexCore</a>
  </div>

  <div class="navbar-center">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.5" fill="none"></circle><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.5"></line></svg>
      <input placeholder="Search..." />
    </div>
  </div>

  <div class="navbar-right">
    <button #notifBtn class="icon-btn notification-btn" aria-label="Notifications" aria-haspopup="true" data-count="3" (click)="toggleNotifications(); $event.stopPropagation()">
      <!-- Polished bell icon with subtle fill and ring animation support -->
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17H9a3 3 0 006 0z" />
          <path d="M18.5 13.5V11a6.5 6.5 0 10-13 0v2.5L4 16h16l-1.5-2.5z" />
        </g>
      </svg>
      <span class="notif-badge" aria-hidden="true">3</span>
      <span class="notif-pulse" aria-hidden="true"></span>
      <span class="visually-hidden">{{ 'navbar.notifications.you_have' | transloco: { count: 3 } }}</span>
    </button>
    <!-- notification dropdown is created dynamically and appended to document.body -->
    <app-notification *ngIf="showNotifications && fallbackInline" class="notification-dropdown" [anchor]="notificationAnchor" (click)="$event.stopPropagation()"></app-notification>

    <app-theme-toggle></app-theme-toggle>

    <!-- Compact language button (always visible) with localized popup aligned to the button -->
    <div class="lang-compact-wrap">
      <button class="lang-compact" aria-label="Change language" (click)="toggleLangMenu(); $event.stopPropagation()">🌐</button>
      <!-- Small language popup shown when compact button is toggled -->
      <ul class="lang-popup" role="menu" *ngIf="showLangMenu">
        <li class="lang-popup-item" role="menuitem" (click)="selectLang('en'); $event.stopPropagation()">🇬🇧 English</li>
        <li class="lang-popup-item" role="menuitem" (click)="selectLang('es'); $event.stopPropagation()">🇪🇸 Español</li>
      </ul>
    </div>

    <!-- plan-info removed per request -->

    <!-- Moved profile into navbar (avatar + name/role) -->
    <div class="nav-profile" title="Administrator" (click)="toggleProfile(); $event.stopPropagation()">
      <div class="avatar">NC</div>

      <div class="profile-dropdown" *ngIf="showProfile" (click)="$event.stopPropagation()">
        <div class="profile-top">
          <div class="avatar-lg">NC</div>
          <div class="profile-meta">
            <div class="name">NexCore Admin</div>
            <div class="email">admin@nexcore.local</div>
          </div>
        </div>
        <div class="profile-actions">
          <button class="item" type="button" (click)="$event.stopPropagation()">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="item-label">Profile</span>
          </button>
          <button class="item" type="button" (click)="$event.stopPropagation()">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="item-label">Settings</span>
          </button>
          <button class="item" type="button" (click)="$event.stopPropagation()">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.4"/><path d="M12 8v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 16h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="item-label">Help</span>
          </button>
          <div class="divider"></div>
          <button class="item logout" type="button" (click)="signOut(); $event.stopPropagation()">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 5v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="item-label">Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
