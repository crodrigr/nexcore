<header class="navbar">
  <div class="navbar-left">
    <button class="icon-btn hamburger-btn" aria-label="Toggle sidebar" (click)="toggleSidebar()" [attr.aria-pressed]="isCollapsed" type="button">
      <svg viewBox="0 0 24 24" class="icon"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a routerLink="/dashboard" class="brand">NexCore</a>
  </div>

  <div class="navbar-center">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.5" fill="none"></circle><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.5"></line></svg>
      <input placeholder="Buscar..." />
    </div>
  </div>

  <div class="navbar-right">
    <button class="icon-btn" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" class="icon"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6 6 0 1 0-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h11z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </button>

    <app-theme-toggle></app-theme-toggle>

    <!-- plan-info removed per request -->

    <!-- Moved profile into navbar (avatar + name/role) -->
    <div class="nav-profile" title="Administrador">
      <div class="avatar">NC</div>
      <div class="profile-info">
        <div class="name">NexCore Admin</div>
        <div class="role">ENTERPRISE ADMIN</div>
      </div>
    </div>
  </div>
</header>
