server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to nexcore-core
    location /api/ {
        proxy_pass http://nexcore-core:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Actor-Id $http_x_actor_id;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }

    # Proxy auth calls to nexcore-auth
    location /auth/ {
        proxy_pass http://nexcore-auth:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Actor-Id $http_x_actor_id;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }

    # Angular routing — todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
